name: VehicleWorkshop

include:
   - ./docker-compose.e2e.yml

# Dev stack: prod stack (app + db + cache) plus playwright, dev build
# target, and source bind-mounts. devcontainer.json points here.

services:
   app:
      build:
         target: dev
      volumes:
         - ..:/app
         - /app/vendor
         - /app/node_modules
      restart: "no"

   playwright:
      volumes:
         - ../tests/e2e:/app/tests/e2e
         - ../.tools/:/app/.tools
