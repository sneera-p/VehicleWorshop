name: VehicleWorkshop

include:
   - ./docker-compose.test.yml

# Dev stack: prod stack (web + db + cache) plus test, dev build
# target, and source bind-mounts. devcontainer.json points here.

services:
   web:
      build:
         target: dev
      volumes:
         - ..:/app
         - /app/vendor
         - /app/node_modules
      restart: "no"

   test:
      # Whole source tree, same as web/worker — PHPUnit runs against code
      # you're actively editing, not what was baked in at build time. The
      # previous ../test/e2e:/web/test/e2e mount was wrong on both ends:
      # specs live at web/test/e2e in the repo, and the image's WORKDIR is
      # /app, not /web.
      volumes:
         - ..:/app
         # Anonymous volumes: keep the image's own vendor/ and
         # node_modules/ instead of letting the host mount above shadow
         # them with whatever (or nothing) is on your machine. vendor/
         # here was built WITH dev deps, which is where phpunit lives.
         - /app/vendor
         - /app/node_modules
         - ../.tools/:/app/.tools
      restart: "no"

   worker:
      build:
         target: dev
      volumes:
         - ..:/app
         - /app/vendor
         - /app/node_modules
      restart: "no"
